name: Release

# Turns a pushed vX.Y.Z tag into a real GitHub Release automatically — see
# CONTRIBUTING.md's "Releasing" section for why bare tags aren't enough on
# their own (invisible in the GitHub UI, no notes shown anywhere, not what
# Swift Package Index displays). This closes the gap structurally instead
# of relying on remembering a separate `gh release create` step by hand
# every time.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # actions/checkout writes the pushed tag into the runner as a *lightweight*
      # ref pointing at the commit, even with fetch-depth: 0 — the annotation
      # object isn't kept. `gh release create --notes-from-tag` reads the local
      # tag, finds no annotation, and silently falls back to the commit message,
      # which is how v0.5.0 first shipped with the wrong release notes and no
      # error anywhere. Re-fetching with --force replaces that lightweight ref
      # with the real annotated object.
      - name: Restore the annotated tag object checkout flattened
        run: git fetch --force --tags

      - name: Create GitHub Release from the tag's own annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes-from-tag --verify-tag
