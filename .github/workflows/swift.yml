name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    # AppKit/CoreText-backed code (DocumentRenderer, PDFRenderer, TableRenderer) is Apple-only —
    # this package can't build or run its tests on a Linux runner at all.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  ios-simulator:
    # DocumentRenderer/TableRenderer/PDFRenderer run on UIKit too (see README) — this is the one
    # job that would actually catch a regression there, since `swift build`/`swift test` above
    # only ever exercise the AppKit half. A plain `swift build` targeting the iOS SDK would only
    # prove the code *compiles*, not that it runs correctly (the UIGraphicsImageRenderer
    # coordinate-flip in PlatformTypes.swift is exactly the kind of bug that compiles fine but
    # renders upside down) — only an actual Simulator test run catches that.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      # Resolved instead of pinned: a hardcoded device name ("iPhone 16") rots every time
      # the runner image ships a new Xcode, and it fails in the worst possible way —
      # xcodebuild answers an unknown destination by printing the destinations it *does*
      # know and carrying on, which doesn't necessarily read as an error. So pick whatever
      # iPhone this image actually has and fail loudly here if there is none.
      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[] | select(.name | startswith("iPhone"))]
                     | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner image." >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test on iOS Simulator
        run: xcodebuild test -scheme MarkdownDocumentKit -destination "id=${{ steps.simulator.outputs.udid }}"
